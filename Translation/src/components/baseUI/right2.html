<!DOCTYPE html><html lang="zh-CN" style=""><svg class="inline-defs-container" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></svg><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>智慧交通OCC调度中心 - 告警趋势分析组件</title>
<!-- BEGIN: CSS Stylesheets -->
<!-- 基础重置与工程字体样式 -->
<style data-purpose="base-typography">
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      background-color: #030712;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* 工业等宽数值字体 */
    .font-mono-num {
      font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Consolas, monospace;
      font-feature-settings: "tnum" 1;
    }
  </style>
<!-- 科技感卡片与晶圆边框质感 -->
<style data-purpose="panel-surfaces">
    .occ-panel-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      background: radial-gradient(circle at 50% 0%, rgba(14, 38, 70, 0.45) 0%, rgba(6, 13, 26, 0.92) 80%);
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 8px;
      padding: 20px 24px 18px 24px;
      box-shadow: 
        0 16px 40px -10px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 24px rgba(0, 140, 255, 0.06);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    /* 精密科技直角线饰与光晕角标 */
    .occ-panel-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(56, 189, 248, 0.2) 15%, 
        rgba(0, 245, 184, 0.8) 50%, 
        rgba(56, 189, 248, 0.2) 85%, 
        transparent 100%);
    }

    .corner-bracket {
      position: absolute;
      width: 6px;
      height: 6px;
      border-color: rgba(56, 189, 248, 0.55);
      pointer-events: none;
    }
    .corner-tl { top: -1px; left: -1px; border-top: 1.5px solid #00f5b8; border-left: 1.5px solid #00f5b8; }
    .corner-tr { top: -1px; right: -1px; border-top: 1.5px solid #38bdf8; border-right: 1.5px solid #38bdf8; }
    .corner-bl { bottom: -1px; left: -1px; border-bottom: 1.5px solid #38bdf8; border-left: 1.5px solid #38bdf8; }
    .corner-br { bottom: -1px; right: -1px; border-bottom: 1.5px solid #00f5b8; border-right: 1.5px solid #00f5b8; }
  </style>
<!-- 头部控制栏与矩阵点点阵 -->
<style data-purpose="header-controls">
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.12);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 告警科技雷达徽标 */
    .radar-icon-box {
      width: 28px;
      height: 28px;
      background: rgba(0, 245, 184, 0.08);
      border: 1px solid rgba(0, 245, 184, 0.35);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 10px rgba(0, 245, 184, 0.15);
      animation: radarBoxGlow 3.5s ease-in-out infinite alternate;
    }

    .radar-pulse-ring {
      width: 14px;
      height: 14px;
      border: 1.5px solid #00f5b8;
      border-radius: 50%;
      position: relative;
    }

    .radar-pulse-ring::after {
      content: '';
      position: absolute;
      inset: -3px;
      border: 1px dashed rgba(0, 245, 184, 0.5);
      border-radius: 50%;
      animation: rotateRing 8s linear infinite;
    }

    .radar-pulse-ring::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      background: #00f5b8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px #00f5b8;
    }

    .main-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #f8fafc;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .sub-code {
      font-size: 10px;
      font-weight: 500;
      color: rgba(148, 163, 184, 0.6);
      letter-spacing: 0.15em;
    }

    /* 矩阵阵列光标与波浪闪烁动效 */
    .matrix-dots {
      display: grid;
      grid-template-columns: repeat(6, 3px);
      gap: 3px;
      opacity: 0.75;
    }

    .matrix-dot {
      width: 3px;
      height: 3px;
      border-radius: 0.5px;
      background-color: #38bdf8;
      animation: dotShimmer 2.4s ease-in-out infinite;
    }

    .matrix-dot:nth-child(1)  { animation-delay: 0.0s; }
    .matrix-dot:nth-child(2)  { animation-delay: 0.15s; }
    .matrix-dot:nth-child(3)  { animation-delay: 0.3s; }
    .matrix-dot:nth-child(4)  { animation-delay: 0.45s; }
    .matrix-dot:nth-child(5)  { animation-delay: 0.6s; }
    .matrix-dot:nth-child(6)  { animation-delay: 0.75s; }
    .matrix-dot:nth-child(7)  { animation-delay: 0.15s; }
    .matrix-dot:nth-child(8)  { animation-delay: 0.3s; }
    .matrix-dot:nth-child(9)  { animation-delay: 0.45s; }
    .matrix-dot:nth-child(10) { animation-delay: 0.6s; }
    .matrix-dot:nth-child(11) { animation-delay: 0.75s; }
    .matrix-dot:nth-child(12) { animation-delay: 0.9s; }

    /* 右侧指标指示与图例 */
    .indicator-group {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
    }

    .legend-indicator-line {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }

    .legend-last-year {
      background: #0284c7;
      box-shadow: 0 0 6px rgba(2, 132, 199, 0.6);
    }

    .legend-current-year {
      background: #00f5b8;
      box-shadow: 0 0 8px rgba(0, 245, 184, 0.8);
    }

    .stat-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .trend-down-val {
      color: #34d399;
      font-weight: 600;
    }

    .open-alert-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
      animation: alertBlink 1.8s infinite;
    }
  </style>
<!-- 图表舞台与 SVG 视觉 -->
<style data-purpose="chart-stage">
    .chart-container {
      position: relative;
      width: 100%;
      height: 250px;
      margin-top: 8px;
      user-select: none;
    }

    .svg-chart {
      width: 100%;
      height: 100%;
      overflow: visible;
      cursor: crosshair;
    }

    /* 刻度文字与网格 */
    .axis-label {
      font-size: 10.5px;
      fill: rgba(148, 163, 184, 0.65);
      font-family: "JetBrains Mono", monospace;
      transition: fill 0.2s ease, font-weight 0.2s ease;
    }

    .axis-label.active-month {
      fill: #38bdf8;
      font-weight: 700;
    }

    .grid-line {
      stroke: rgba(56, 189, 248, 0.1);
      stroke-dasharray: 3, 3;
      stroke-width: 1;
    }

    /* 面积渐进显现遮罩动画 */
    .chart-area {
      opacity: 0;
      animation: areaReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.25s;
    }

    /* 曲线动态描边入场 */
    .line-last-year {
      stroke: #0284c7;
      stroke-width: 2.2;
      fill: none;
      filter: drop-shadow(0 2px 5px rgba(2, 132, 199, 0.35));
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawCurve 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .line-current-year {
      stroke: #00f5b8;
      stroke-width: 2.8;
      fill: none;
      filter: drop-shadow(0 0 8px rgba(0, 245, 184, 0.6));
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawCurve 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.15s;
    }

    /* 水波纹 / 雷达脉冲扩散波 */
    .pulse-point {
      transform-origin: center;
      animation: pulseCore 2.2s ease-in-out infinite;
    }

    .pulse-wave-1 {
      transform-origin: center;
      animation: sonarWave 2.4s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
    }

    .pulse-wave-2 {
      transform-origin: center;
      animation: sonarWave 2.4s cubic-bezier(0.2, 0.6, 0.35, 1) infinite 0.8s;
    }

    /* 静态默认浮标标签 */
    .metric-badge {
      opacity: 0;
      animation: badgeFade 0.6s ease-out forwards 1.4s;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* 交互式数据探针及跟随提示卡片 */
    .interactive-crosshair-group {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .crosshair-line {
      stroke: rgba(0, 245, 184, 0.45);
      stroke-width: 1.2;
      stroke-dasharray: 3, 3;
      filter: drop-shadow(0 0 4px rgba(0, 245, 184, 0.4));
    }

    .probe-point-current {
      fill: #00f5b8;
      stroke: #051726;
      stroke-width: 2;
      filter: drop-shadow(0 0 6px #00f5b8);
    }

    .probe-point-last {
      fill: #0284c7;
      stroke: #051726;
      stroke-width: 2;
      filter: drop-shadow(0 0 6px #0284c7);
    }

    /* 探针富文本浮层卡片 (HTML DOM) */
    .probe-tooltip {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -105%);
      transition: opacity 0.2s ease, transform 0.15s ease-out;
      background: rgba(6, 18, 38, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), 0 0 14px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(12px);
      z-index: 50;
      min-width: 130px;
    }

    .tooltip-header {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      padding-bottom: 4px;
    }

    .tooltip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      line-height: 1.5;
    }

    .tooltip-label {
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tooltip-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .dot-cyan { background-color: #00f5b8; box-shadow: 0 0 5px #00f5b8; }
    .dot-blue { background-color: #0284c7; box-shadow: 0 0 5px #0284c7; }

    .tooltip-val-cyan {
      color: #00f5b8;
      font-weight: 700;
    }

    .tooltip-val-blue {
      color: #38bdf8;
      font-weight: 600;
    }

    .tooltip-diff {
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px dashed rgba(56, 189, 248, 0.15);
      font-size: 10px;
      display: flex;
      justify-content: space-between;
    }

    /* 底部 OCC 状态条 */
    .status-dock {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed rgba(56, 189, 248, 0.15);
      font-size: 11px;
      color: rgba(148, 163, 184, 0.7);
    }

    .status-cell {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00f5b8;
      box-shadow: 0 0 6px #00f5b8;
      transition: opacity 0.2s ease;
    }

    .data-val-highlight {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
<!-- 动效定义 -->
<style data-purpose="animations">
    @keyframes drawCurve {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes areaReveal {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes radarBoxGlow {
      0% { box-shadow: 0 0 6px rgba(0, 245, 184, 0.15); border-color: rgba(0, 245, 184, 0.35); }
      100% { box-shadow: 0 0 14px rgba(0, 245, 184, 0.45); border-color: rgba(0, 245, 184, 0.7); }
    }

    @keyframes dotShimmer {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 1; background-color: #00f5b8; box-shadow: 0 0 4px #00f5b8; transform: scale(1.15); }
    }

    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.22); opacity: 0.9; }
    }

    @keyframes sonarWave {
      0% {
        r: 4;
        opacity: 0.9;
        stroke-width: 1.8;
      }
      70% {
        opacity: 0.3;
      }
      100% {
        r: 16;
        opacity: 0;
        stroke-width: 0.3;
      }
    }

    @keyframes alertBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes badgeFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
<!-- END: CSS Stylesheets -->
</head>
<body>
<!-- BEGIN: OccTrendComponent -->
<section aria-label="告警趋势分析" class="occ-panel-wrapper" data-purpose="alarm-trend-panel">
<!-- 四角科技卡角 -->
<span class="corner-bracket corner-tl"></span>
<span class="corner-bracket corner-tr"></span>
<span class="corner-bracket corner-bl"></span>
<span class="corner-bracket corner-br"></span>
<!-- BEGIN: HeaderSection -->
<header class="header-container" data-purpose="panel-header">
<!-- 标题与微波束图符 -->
<div class="title-group">
<div class="radar-icon-box" title="告警遥测链路正常">
<div class="radar-pulse-ring"></div>
</div>
<div class="main-title">
<span class="">告警趋势</span>

</div>
<!-- 矩阵点阵点 -->
<div aria-hidden="true" class="matrix-dots">
<span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span>
<span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span><span class="matrix-dot"></span>
</div>
</div>
<!-- 右侧图例与指标小标 -->
<div class="indicator-group" data-purpose="legend-stats">
<div class="legend-item">
<span class="legend-indicator-line legend-last-year"></span>
<span class="">去年</span>
</div>
<div class="legend-item">
<span class="legend-indicator-line legend-current-year"></span>
<span class="">今年实时</span>
</div>
<div class="stat-pill font-mono-num" title="年同比变动率">


</div>
<div class="stat-pill font-mono-num" title="OCC 活跃待闭环故障">
<span class="open-alert-dot"></span>

</div>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: TrendChartStage -->
<div class="chart-container" data-purpose="chart-canvas-view" id="chartWrapper">
<!-- 原生自适应工业级 SVG 矢量图表 (视口 0 0 760 240) -->
<svg class="svg-chart" id="occSvgChart" preserveAspectRatio="none" viewBox="0 0 760 240">
<defs>
<!-- 去年曲线面积渐变 -->
<linearGradient id="lastYearAreaGrad" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"></stop>
<stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"></stop>
</linearGradient>
<!-- 今年高亮翡翠绿渐变面积 -->
<linearGradient id="currentYearAreaGrad" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#00f5b8" stop-opacity="0.34"></stop>
<stop offset="60%" stop-color="#00f5b8" stop-opacity="0.08"></stop>
<stop offset="100%" stop-color="#00f5b8" stop-opacity="0.0"></stop>
</linearGradient>
<!-- 峰值气泡阴影 -->
<filter height="140%" id="badgeGlow" width="140%" x="-20%" y="-20%">
<feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity="0.6" stdDeviation="3"></feDropShadow>
</filter>
<!-- 流动脉冲微光光晕 -->
<filter height="200%" id="pulseGlow" width="200%" x="-50%" y="-50%">
<feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="3"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
</defs>
<!-- Y 轴水平刻度辅助线与数值 (Y: 0~300, 映射高度 200 -> 20) -->
<!-- Y=300 (y=20) -->
<g class="grid-group">
<line class="grid-line" x1="45" x2="745" y1="20" y2="20"></line>
<text class="axis-label font-mono-num" text-anchor="end" x="35" y="24">300</text>
</g>
<!-- Y=250 (y=50) -->
<g class="grid-group">
<line class="grid-line" x1="45" x2="745" y1="50" y2="50"></line>
<text class="axis-label font-mono-num" text-anchor="end" x="35" y="54">250</text>
</g>
<!-- Y=200 (y=80) -->
<g class="grid-group">
<line class="grid-line" x1="45" x2="745" y1="80" y2="80"></line>
<text class="axis-label font-mono-num" text-anchor="end" x="35" y="84">200</text>
</g>
<!-- Y=150 (y=110) -->
<g class="grid-group">
<line class="grid-line" x1="45" x2="745" y1="110" y2="110"></line>
<text class="axis-label font-mono-num" text-anchor="end" x="35" y="114">150</text>
</g>
<!-- Y=100 (y=140) -->
<g class="grid-group">
<line class="grid-line" x1="45" x2="745" y1="140" y2="140"></line>
<text class="axis-label font-mono-num" text-anchor="end" x="35" y="144">100</text>
</g>
<!-- Y=50 (y=170) -->
<g class="grid-group">
<line class="grid-line" x1="45" x2="745" y1="170" y2="170"></line>
<text class="axis-label font-mono-num" text-anchor="end" x="35" y="174">50</text>
</g>
<!-- 轴底线 Y=0 (y=200) -->
<g class="grid-group">
<line stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2" x1="45" x2="745" y1="200" y2="200"></line>
<text class="axis-label font-mono-num" text-anchor="end" x="35" y="204">0</text>
</g>
<!-- 轴单位标识 -->
<text class="axis-label" fill="rgba(148, 163, 184, 0.5)" font-size="9" text-anchor="start" x="44" y="8">(件/次)</text>
<!-- X 轴月份刻度 (从 1月 到 12月, X 均匀跨度: 58 到 732, step ≈ 61.27) -->
<g class="x-axis-labels" id="monthLabels">
<text class="axis-label" data-idx="0" text-anchor="middle" x="58" y="222" fill="rgba(148, 163, 184, 0.65)" font-weight="400">1月</text>
<text class="axis-label" data-idx="1" text-anchor="middle" x="119" y="222" fill="rgba(148, 163, 184, 0.65)" font-weight="400">2月</text>
<text class="axis-label" data-idx="2" text-anchor="middle" x="180" y="222" fill="rgba(148, 163, 184, 0.65)" font-weight="400">3月</text>
<text class="axis-label" data-idx="3" text-anchor="middle" x="242" y="222" fill="rgba(148, 163, 184, 0.65)" font-weight="400">4月</text>
<text class="axis-label" data-idx="4" text-anchor="middle" x="303" y="222" fill="rgba(148, 163, 184, 0.65)" font-weight="400">5月</text>
<text class="axis-label" data-idx="5" text-anchor="middle" x="364" y="222" fill="rgba(148, 163, 184, 0.65)" font-weight="400">6月</text>

<script data-purpose="industrial-telemetry-engine">
    (function () {
      // 1. 月份核心业务数据集与坐标映射
      const monthData = [
        { month: '1月',  x: 58,  currentVal: 108, currentY: 135, lastVal: 130, lastY: 122 },
        { month: '2月',  x: 119, currentVal: 118, currentY: 129, lastVal: 150, lastY: 110 },
        { month: '3月',  x: 180, currentVal: 128, currentY: 123, lastVal: 148, lastY: 111 },
        { month: '4月',  x: 242, currentVal: 110, currentY: 134, lastVal: 130, lastY: 122 },
        { month: '5月',  x: 303, currentVal: 148, currentY: 111, lastVal: 145, lastY: 113 },
        { month: '6月',  x: 364, currentVal: 125, currentY: 125, lastVal: 155, lastY: 107 },
        { month: '7月',  x: 425, currentVal: 210, currentY: 74,  lastVal: 230, lastY: 62 },
        { month: '8月',  x: 487, currentVal: 125, currentY: 125, lastVal: 150, lastY: 110 },
        { month: '9月',  x: 548, currentVal: 105, currentY: 137, lastVal: 120, lastY: 128 },
        { month: '10月', x: 609, currentVal: 98,  currentY: 141, lastVal: 112, lastY: 132 },
        { month: '11月', x: 670, currentVal: 165, currentY: 101, lastVal: 205, lastY: 77 },
        { month: '12月', x: 732, currentVal: 228, currentY: 63,  lastVal: 258, lastY: 45 }
      ];

      // 2. 能量脉冲光点沿今年主曲线连续流动 (requestAnimationFrame)
      const currentYearPath = document.getElementById('currentYearPath');
      const flowPulseGroup = document.getElementById('flowPulseEnergyGroup');
      
      if (currentYearPath && flowPulseGroup) {
        let totalPathLength = 0;
        try {
          totalPathLength = currentYearPath.getTotalLength();
        } catch(e) {
          totalPathLength = 800;
        }

        const duration = 4800; // 4.8 秒周期自左向右流动
        let startTime = null;

        function animateEnergyFlow(timestamp) {
          if (!startTime) startTime = timestamp;
          const elapsed = (timestamp - startTime) % duration;
          const progress = elapsed / duration;

          if (totalPathLength > 0) {
            const point = currentYearPath.getPointAtLength(progress * totalPathLength);
            flowPulseGroup.setAttribute('transform', `translate(${point.x}, ${point.y})`);
            
            // 边缘平滑淡入淡出
            if (progress < 0.05) {
              flowPulseGroup.style.opacity = progress / 0.05;
            } else if (progress > 0.95) {
              flowPulseGroup.style.opacity = (1 - progress) / 0.05;
            } else {
              flowPulseGroup.style.opacity = '1';
            }
          }

          requestAnimationFrame(animateEnergyFlow);
        }

        // 曲线入场动画初步展开后再启动流光
        setTimeout(() => {
          requestAnimationFrame(animateEnergyFlow);
        }, 300);
      }

      // 3. 交互式探针跟随 (Crosshair Probe & Tooltip)
      const chartWrapper = document.getElementById('chartWrapper');
      const svg = document.getElementById('occSvgChart');
      const crosshairGroup = document.getElementById('crosshairGroup');
      const crosshairLine = document.getElementById('crosshairLine');
      const probeDotCurrent = document.getElementById('probeDotCurrent');
      const probeDotLast = document.getElementById('probeDotLast');
      const probeTooltip = document.getElementById('probeTooltip');
      const defaultBadgeJul = document.getElementById('badgeJul');
      const defaultBadgeDec = document.getElementById('badgeDec');

      const tooltipMonth = document.getElementById('tooltipMonth');
      const tooltipValCurrent = document.getElementById('tooltipValCurrent');
      const tooltipValLast = document.getElementById('tooltipValLast');
      const tooltipDiff = document.getElementById('tooltipDiff');
      const monthLabelTexts = document.querySelectorAll('#monthLabels .axis-label');

      function findClosestMonth(svgX) {
        let minDiff = Infinity;
        let closestIndex = 0;
        for (let i = 0; i < monthData.length; i++) {
          const diff = Math.abs(monthData[i].x - svgX);
          if (diff < minDiff) {
            minDiff = diff;
            closestIndex = i;
          }
        }
        return closestIndex;
      }

      function handleMouseMove(e) {
        if (!svg) return;
        const rect = svg.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        // 映射到 SVG 0~760 坐标系
        const scaleX = 760 / rect.width;
        const svgX = clientX * scaleX;

        // 仅在数据刻度有效范围内激活
        if (svgX < 35 || svgX > 750) {
          handleMouseLeave();
          return;
        }

        const idx = findClosestMonth(svgX);
        const item = monthData[idx];

        // 显示并吸附探针
        crosshairGroup.style.opacity = '1';
        crosshairLine.setAttribute('x1', item.x);
        crosshairLine.setAttribute('x2', item.x);

        probeDotCurrent.setAttribute('cx', item.x);
        probeDotCurrent.setAttribute('cy', item.currentY);

        probeDotLast.setAttribute('cx', item.x);
        probeDotLast.setAttribute('cy', item.lastY);

        // 高亮对应的月份文本
        monthLabelTexts.forEach((lbl, i) => {
          if (i === idx) {
            lbl.classList.add('active-month');
            lbl.setAttribute('fill', '#38bdf8');
            lbl.setAttribute('font-weight', '700');
          } else {
            lbl.classList.remove('active-month');
            if (i !== 6 && i !== 11) {
              lbl.setAttribute('fill', 'rgba(148, 163, 184, 0.65)');
              lbl.setAttribute('font-weight', '400');
            } else if (i === 6) {
              lbl.setAttribute('fill', '#38bdf8');
            } else if (i === 11) {
              lbl.setAttribute('fill', '#00f5b8');
            }
          }
        });

        // 计算同比变动率
        const diffRatio = (((item.currentVal - item.lastVal) / item.lastVal) * 100).toFixed(1);
        const isUp = item.currentVal > item.lastVal;

        // 更新 Tooltip 数据
        tooltipMonth.textContent = item.month + ' 遥测数据';
        tooltipValCurrent.textContent = item.currentVal + ' 件';
        tooltipValLast.textContent = item.lastVal + ' 件';
        tooltipDiff.textContent = (isUp ? '↑ +' : '↓ ') + diffRatio + '%';
        tooltipDiff.style.color = isUp ? '#f87171' : '#34d399';

        // 计算 Tooltip 像素位置 (避免右边缘出界)
        const pixelX = (item.x / 760) * rect.width;
        const higherY = Math.min(item.currentY, item.lastY);
        const pixelY = (higherY / 240) * rect.height;

        probeTooltip.style.opacity = '1';
        let tooltipLeft = pixelX;
        let transformStr = 'translate(-50%, -115%)';

        if (pixelX < 75) {
          transformStr = 'translate(0%, -115%)';
        } else if (pixelX > rect.width - 75) {
          transformStr = 'translate(-100%, -115%)';
        }

        probeTooltip.style.left = tooltipLeft + 'px';
        probeTooltip.style.top = pixelY + 'px';
        probeTooltip.style.transform = transformStr;

        // 交互时轻微弱化固定气泡避免遮挡
        if (defaultBadgeJul) defaultBadgeJul.style.opacity = (idx === 6) ? '0.15' : '0.85';
        if (defaultBadgeDec) defaultBadgeDec.style.opacity = (idx === 11) ? '0.15' : '0.85';
      }

      function handleMouseLeave() {
        crosshairGroup.style.opacity = '0';
        probeTooltip.style.opacity = '0';

        // 还原固定气泡
        if (defaultBadgeJul) defaultBadgeJul.style.opacity = '1';
        if (defaultBadgeDec) defaultBadgeDec.style.opacity = '1';

        // 恢复默认月份状态 (7月与12月常亮)
        monthLabelTexts.forEach((lbl, i) => {
          if (i === 6) {
            lbl.classList.add('active-month');
            lbl.setAttribute('fill', '#38bdf8');
            lbl.setAttribute('font-weight', '600');
          } else if (i === 11) {
            lbl.classList.add('active-month');
            lbl.setAttribute('fill', '#00f5b8');
            lbl.setAttribute('font-weight', '600');
          } else {
            lbl.classList.remove('active-month');
            lbl.setAttribute('fill', 'rgba(148, 163, 184, 0.65)');
            lbl.setAttribute('font-weight', '400');
          }
        });
      }

      if (chartWrapper) {
        chartWrapper.addEventListener('mousemove', handleMouseMove);
        chartWrapper.addEventListener('mouseleave', handleMouseLeave);
      }

      // 4. 底栏实时遥测心跳闪烁
      const occLiveDot = document.getElementById('occLiveDot');
      if (occLiveDot) {
        setInterval(() => {
          occLiveDot.style.opacity = '0.2';
          setTimeout(() => {
            occLiveDot.style.opacity = '1';
          }, 180);
        }, 2800);
      }
    })();
  </script>
